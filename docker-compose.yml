version: '3.8'

services:
  maaa:
    build: .
    ports:
      - "${WEB_PORT:-3001}:3001"
    env_file:
      - .env
    volumes:
      - auth_cache:/app/auth_cache
      - ./schematics:/app/schematics:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  auth_cache:
